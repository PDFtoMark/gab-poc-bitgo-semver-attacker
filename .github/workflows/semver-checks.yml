on:   # yamllint disable-line rule:truthy
  pull_request:

name: Check semver breaks
permissions: {}

jobs:
  PR:
    name: PR Semver - stable toolchain
    runs-on: ubuntu-24.04
    steps:
      - name: "Simulate semver check"
        run: |
          echo "checking semver"
          # attacker-crafted artifact: a zip that contains the file 'semver-break'
          # holding an arbitrary PR number chosen by the attacker
          mkdir -p out
          rm -rf work && mkdir work && cd work
          echo -n 1 > semver-break
          zip -q semver-break.zip semver-break
          mv semver-break.zip ../out/semver-break.zip
          cd ..
          ls -l out
      - name: "Save breaking state"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: semver-break
          path: out/semver-break.zip
